[project]
name = "ai-code-reviewer"
version = "0.3.0"
requires-python = ">=3.14"
description = "AI-powered code review agent with breaking change detection"

dependencies = [
    # FastAPI
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    # LangGraph + LLM (updated to latest)
    "langgraph>=1.0.0",
    "langchain>=0.3.18",
    "langchain-openai>=0.3.5",
    "langchain-anthropic>=0.3.5",
    # GitHub
    "httpx>=0.28.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    # Background Tasks
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.2.0",
    # Database - SQLModel (ORM)
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    # YAML parsing
    "pyyaml>=6.0.2",
    # Slack
    "slack-sdk>=3.34.0",
    # Utilities
    "structlog>=25.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "aiohttp>=3.13.3",
    # AST Parsing (tree-sitter-language-pack supports Python 3.13+)
    "tree-sitter>=0.24.0",
    "tree-sitter-language-pack>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/chat/prompts.py" = ["E501"]  # LLM prompt templates with long example lines
"src/agents/prompts/*.py" = ["E501"]  # LLM prompt templates

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

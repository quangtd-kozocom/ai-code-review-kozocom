[project]
name = "ai-code-reviewer"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # LangGraph + LLM
    "langgraph>=0.2.55",
    "langchain>=0.3.13",
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.3.0",
    # GitHub
    "httpx>=0.28.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    # Background Tasks
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.2.0",
    # Database - SQLModel (ORM)
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    # YAML parsing
    "pyyaml>=6.0.2",
    # Slack
    "slack-sdk>=3.33.0",
    # Utilities
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "aiohttp>=3.13.3",
    # RAG - Vector Database & Embeddings
    "pinecone>=5.0.0",
    "google-genai>=1.0.0",
    # RAG - AST Parsing (tree-sitter-language-pack supports Python 3.13+)
    "tree-sitter>=0.24.0",
    "tree-sitter-language-pack>=0.7.0",
    # RAG - Git Operations
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/chat/prompts.py" = ["E501"]  # LLM prompt templates with long example lines

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]
